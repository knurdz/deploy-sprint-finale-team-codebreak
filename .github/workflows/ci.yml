name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('team-site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Report dependency cache status
        run: |
          {
            echo "### Dependency cache"
            echo ""
            echo "- Cache key: \`${{ runner.os }}-npm-${{ hashFiles('team-site/package-lock.json') }}\`"
            echo "- Cache hit: \`${{ steps.npm-cache.outputs.cache-hit }}\`"
            echo "- Install command: \`npm ci\` (lockfile-strict, unchanged)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          TEAM_NAME: codebreak
        run: npm run build
        working-directory: team-site

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: team-site/dist

  server-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Start server and check routes
        run: |
          set -euo pipefail
          APP_PORT=8099 node index.js &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for _ in $(seq 1 20); do
            if curl -sf http://localhost:8099/health > /dev/null; then
              break
            fi
            sleep 0.5
          done

          echo "GET /health"
          curl -sf http://localhost:8099/health

          echo "GET /status"
          status=$(curl -sf http://localhost:8099/status)
          echo "$status"
          echo "$status" | grep -q '"provider":"openweather"'

          echo "GET /api/weather (no key configured, expect 503)"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8099/api/weather)
          test "$code" = "503"
        working-directory: server
