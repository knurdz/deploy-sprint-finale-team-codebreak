name: Post-Deploy Smoke Tests

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Request Organizer Deploy"]
    types:
      - completed

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke tests
        env:
          PUBLIC_URI: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || vars.IP_PUBLIC_URL }}
        run: |
          chmod +x team-site/scripts/smoke-test.sh
          team-site/scripts/smoke-test.sh | tee smoke-output.log

      - name: Write summary
        if: always()
        run: |
          echo "## T19 Smoke Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat smoke-output.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"