name: Request Organizer Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: request-organizer-deploy
  cancel-in-progress: false

jobs:
  request-deploy:
    name: Request deployer publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        !contains(github.event.workflow_run.head_commit.message, '[skip deploy]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve deploy request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_SHA: ${{ github.sha }}
          MANUAL_RUN_ID: ${{ github.run_id }}
                run: |
          set -euo pipefail

          lock_dir="/tmp/deploy-sprint-team.lock"
          if ! mkdir "$lock_dir"; then
            echo "T28 another deploy is running"
            exit 1
          fi
          trap 'rmdir "$lock_dir"' EXIT

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            sha="$MANUAL_SHA"
            branch="main"
            source_run_id="$MANUAL_RUN_ID"
          else
            sha="$WORKFLOW_RUN_SHA"
            branch="$WORKFLOW_RUN_BRANCH"
            source_run_id="$WORKFLOW_RUN_ID"
          fi

          if [ "$branch" != "main" ]; then
            echo "Only main branch deploy requests are allowed. Got: $branch"
            exit 1
          fi

          {
            echo "sha=$sha"
            echo "branch=$branch"
            echo "source_run_id=$source_run_id"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve CI run for artifact
        id: ci_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.request.outputs.sha }}
          WORKFLOW_RUN_EVENT_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          run_id="$WORKFLOW_RUN_EVENT_ID"

          if [ -z "$run_id" ]; then
            run_id=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
          fi

          if [ -z "$run_id" ]; then
            echo "No successful CI run found for sha $SHA"
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download CI artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist-${{ steps.request.outputs.sha }}
          path: ./release-candidate
          run-id: ${{ steps.ci_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record artifact identity
        id: artifact
        env:
          SHA: ${{ steps.request.outputs.sha }}
          CI_RUN_ID: ${{ steps.ci_run.outputs.run_id }}
        run: |
          set -euo pipefail

          artifact_name="site-dist-${SHA}"

          printf '{"task":"T03","artifact":"%s","commit":"%s","ciRunId":"%s"}\n' \
            "$artifact_name" "$SHA" "$CI_RUN_ID" > release-candidate/artifact.json

          cat release-candidate/artifact.json

          {
            echo "### Deploy artifact"
            echo ""
            echo "- Artifact: \`${artifact_name}\`"
            echo "- Source CI run: \`${CI_RUN_ID}\`"
            echo "- Commit: \`${SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ steps.request.outputs.sha }}
          path: release-candidate/artifact.json

      - name: Request deploy from organizer deployer
        env:
          DEPLOYER_DISPATCH_TOKEN: ${{ secrets.DEPLOYER_DISPATCH_TOKEN }}
          DEPLOYER_REPO: knurdz/deploy-sprint-deployer
          TEAM_REPO: ${{ github.repository }}
          TEAM_SHA: ${{ steps.request.outputs.sha }}
          TEAM_BRANCH: ${{ steps.request.outputs.branch }}
          SOURCE_RUN_ID: ${{ steps.request.outputs.source_run_id }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          ARTIFACT_CI_RUN_ID: ${{ steps.ci_run.outputs.run_id }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOYER_DISPATCH_TOKEN" ]; then
            echo "DEPLOYER_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          python3 - <<'PY' > payload.json
          import json
          import os

          payload = {
              "event_type": "team-codebreak-main-merged",
              "client_payload": {
                  "team": "codebreak",
                  "repo": os.environ["TEAM_REPO"],
                  "sha": os.environ["TEAM_SHA"],
                  "branch": os.environ["TEAM_BRANCH"],
                  "source_run_id": os.environ["SOURCE_RUN_ID"],
                  "artifact_name": os.environ["ARTIFACT_NAME"],
                  "artifact_ci_run_id": os.environ["ARTIFACT_CI_RUN_ID"],
              },
          }

          print(json.dumps(payload))
          PY

          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOYER_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOYER_REPO}/dispatches" \
            --data @payload.json

          echo "Requested organizer deployment for ${TEAM_REPO}@${TEAM_SHA}."
